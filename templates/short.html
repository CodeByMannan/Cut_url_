<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Details - ShadowLink</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            color: #e0e0e0;
            overflow: hidden;
            position: relative;
        }
        /* Animated background elements */
        .bg-element {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.4;
            animation: float 20s infinite ease-in-out;
        }
        .bg-element:nth-child(1) {
            width: 300px;
            height: 300px;
            background: #4a00e0;
            top: -150px;
            left: -150px;
            animation-delay: 0s;
        }
        .bg-element:nth-child(2) {
            width: 400px;
            height: 400px;
            background: #1a237e;
            bottom: -200px;
            right: -200px;
            animation-delay: 5s;
        }
        .bg-element:nth-child(3) {
            width: 250px;
            height: 250px;
            background: #311b92;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 10s;
        }
        @keyframes float {
            0%,
            100% {
                transform: translate(0, 0) rotate(0deg);
            }
            33% {
                transform: translate(30px, -30px) rotate(120deg);
            }
            66% {
                transform: translate(-20px, 20px) rotate(240deg);
            }
        }
        /* Floating particles */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }
        .particle {
            position: absolute;
            background: rgba(142, 45, 226, 0.3);
            border-radius: 50%;
            pointer-events: none;
            animation: particle-float 15s linear infinite;
        }
        @keyframes particle-float {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 0.4;
            }
            90% {
                opacity: 0.4;
            }
            100% {
                transform: translateY(-100vh) translateX(100px);
                opacity: 0;
            }
        }
        /* Main card container */
        .card-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 600px;
            padding: 40px;
            background: rgba(20, 20, 35, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5),
                0 5px 15px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            animation: fadeIn 1s ease-out;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
            background: linear-gradient(90deg, #8e2de2, #4a00e0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 15px rgba(142, 45, 226, 0.3);
            letter-spacing: 1px;
        }
        /* Link sections */
        .link-section {
            margin-bottom: 30px;
            padding: 25px;
            background: rgba(30, 30, 45, 0.5);
            border-radius: 15px;
            border: 1px solid rgba(100, 100, 150, 0.2);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .link-section::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(142, 45, 226, 0.1), rgba(74, 0, 224, 0.1));
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: -1;
        }
        .link-section:hover::before {
            opacity: 1;
        }
        .link-section:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            border-color: rgba(142, 45, 226, 0.4);
        }
        .section-title {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            font-size: 1.2rem;
            color: #c0c0c0;
        }
        .section-icon {
            width: 24px;
            height: 24px;
            margin-right: 10px;
            background: linear-gradient(90deg, #8e2de2, #4a00e0);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .section-icon svg {
            width: 14px;
            height: 14px;
            fill: white;
        }
        .link-display {
            display: flex;
            align-items: center;
            background: rgba(20, 20, 35, 0.7);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid rgba(100, 100, 150, 0.2);
            position: relative;
            overflow: hidden;
        }
        .link-text {
            flex: 1;
            font-size: 1rem;
            color: #e0e0e0;
            word-break: break-all;
            padding-right: 10px;
        }
        .copy-btn {
            width: 40px;
            height: 40px;
            background: rgba(142, 45, 226, 0.2);
            border: 1px solid rgba(142, 45, 226, 0.4);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .copy-btn:hover {
            background: rgba(142, 45, 226, 0.3);
            border-color: rgba(142, 45, 226, 0.6);
            transform: scale(1.05);
        }
        .copy-btn svg {
            width: 18px;
            height: 18px;
            fill: #c0c0c0;
        }
        .link-stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #a0a0a0;
        }
        .stat-item {
            display: flex;
            align-items: center;
        }
        .stat-icon {
            width: 16px;
            height: 16px;
            margin-right: 5px;
            fill: #8e2de2;
        }
        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(30, 30, 45, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 15px 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(142, 45, 226, 0.4);
            color: #e0e0e0;
            font-size: 0.95rem;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 100;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        /* Responsive design */
        @media (max-width: 600px) {
            .card-container {
                padding: 30px 20px;
            }
            h1 {
                font-size: 2rem;
            }
            .link-section {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Animated background elements -->
    <div class="bg-element"></div>
    <div class="bg-element"></div>
    <div class="bg-element"></div>
    <!-- Floating particles -->
    <div class="particles" id="particles"></div>
    <!-- Main card container -->
    <div class="card-container">
        <h1>Link Details</h1>
        <!-- Short Link Section -->
        <div class="link-section">
            <div class="section-title">
                <div class="section-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M14.8,8L16,9.2l-4,4l-4-4L9.2,8L12,10.8L14.8,8z" />
                    </svg>
                </div>
                Short Link
            </div>
            <div class="link-display">
            <!-- {% if sh %}
                {{sh}}
            {% endif %} -->
           
               <div class="link-text"  id="shortLink"><a href="{{sh}}" style="color: #c0c0c0; text-underline-offset: none;">{{ sh }}</a> </div>
                
                <div class="copy-btn" onclick="copyToClipboard('shortLink')">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z" />
                    </svg>
                </div>
            </div>
             

        </div>
     
        <!-- Original Link Section -->
        <div class="link-section">
            <div class="section-title">
                <div class="section-icon">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M10.59,13.41C11,13.8 11,14.44 10.59,14.83C10.2,15.22 9.56,15.22 9.17,14.83C7.22,12.88 7.22,9.71 9.17,7.76V7.76L12.71,4.22C14.66,2.27 17.83,2.27 19.78,4.22C21.73,6.17 21.73,9.34 19.78,11.29L18.29,12.78C18.3,11.96 18.17,11.14 17.89,10.36L18.36,9.88C19.54,8.71 19.54,6.81 18.36,5.64C17.19,4.46 15.29,4.46 14.12,5.64L10.59,9.17C9.41,10.34 9.41,12.24 10.59,13.41M13.41,9.17C13.8,8.78 14.44,8.78 14.83,9.17C16.78,11.12 16.78,14.29 14.83,16.24V16.24L11.29,19.78C9.34,21.73 6.17,21.73 4.22,19.78C2.27,17.83 2.27,14.66 4.22,12.71L5.71,11.22C5.7,12.04 5.83,12.86 6.11,13.65L5.64,14.12C4.46,15.29 4.46,17.19 5.64,18.36C6.81,19.54 8.71,19.54 9.88,18.36L13.41,14.83C14.59,13.66 14.59,11.76 13.41,10.59C13,10.2 13,9.56 13.41,9.17Z" />
                    </svg>
                </div>
                Original Link
            </div>
            <div class="link-display">
                <div class="link-text" id="originalLink">{{org}}</div>
                <div class="copy-btn" onclick="copyToClipboard('originalLink')">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z" />
                    </svg>
                </div>
            </div>

        </div>
    </div>
    
    <!-- Go Back Button -->
   <a href="/"> <button id="goBackBtn" style="display: none;">Go Back</button></a>
    
    <!-- Toast notification -->
    <div class="toast" id="toast">Link copied to clipboard!</div>
 
    <script>
        // Create floating particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 30;
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                // Random size between 2px and 6px
                const size = Math.random() * 4 + 2;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                // Random starting position
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = `${Math.random() * 100}%`;
                // Random animation duration
                const duration = Math.random() * 10 + 15;
                particle.style.animationDuration = `${duration}s`;
                // Random delay
                particle.style.animationDelay = `${Math.random() * 5}s`;
                particlesContainer.appendChild(particle);
            }
        }
        // Initialize particles on page load
        window.addEventListener('load', createParticles);
        // Copy to clipboard function
        function copyToClipboard(elementId) {
            const text = document.getElementById(elementId).innerText;
            // Create a temporary textarea element
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            // Select and copy the text
            textarea.select();
            document.execCommand('copy');
            // Remove the temporary element
            document.body.removeChild(textarea);
            // Show toast notification
            showToast();
        }
        // Show toast notification
        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            // Hide the toast after 3 seconds
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
    
    <script>
        // Create style for the go back button
        const style = document.createElement('style');
        style.textContent = `
            #goBackBtn {
                position: fixed;
                bottom: 30px;
                left: 50%;
                transform: translateX(-50%);
                padding: 12px 25px;
                background: rgba(142, 45, 226, 0.2);
                border: 1px solid rgba(142, 45, 226, 0.4);
                border-radius: 10px;
                color: #e0e0e0;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                font-size: 0.95rem;
                cursor: pointer;
                transition: all 0.3s ease;
                z-index: 99;
            }
            #goBackBtn:hover {
                background: rgba(142, 45, 226, 0.3);
                border-color: rgba(142, 45, 226, 0.6);
                transform: translateX(-50%) scale(1.05);
            }
        `;
        document.head.appendChild(style);
        
        // Show the button and add event listener
        document.getElementById('goBackBtn').style.display = 'block';
        document.getElementById('goBackBtn').addEventListener('click', function() {
            window.history.back();
        });
    </script>
</body>
</html>
