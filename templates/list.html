<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Links - ShadowLink</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            color: #e0e0e0;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        /* Animated background elements */
        .bg-element {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.4;
            animation: float 20s infinite ease-in-out;
            z-index: -1;
        }

        .bg-element:nth-child(1) {
            width: 300px;
            height: 300px;
            background: #4a00e0;
            top: -150px;
            left: -150px;
            animation-delay: 0s;
        }

        .bg-element:nth-child(2) {
            width: 400px;
            height: 400px;
            background: #1a237e;
            bottom: -200px;
            right: -200px;
            animation-delay: 5s;
        }

        .bg-element:nth-child(3) {
            width: 250px;
            height: 250px;
            background: #311b92;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 10s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) rotate(0deg);
            }
            33% {
                transform: translate(30px, -30px) rotate(120deg);
            }
            66% {
                transform: translate(-20px, 20px) rotate(240deg);
            }
        }

        /* Floating particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }

        .particle {
            position: absolute;
            background: rgba(142, 45, 226, 0.3);
            border-radius: 50%;
            pointer-events: none;
            animation: particle-float 15s linear infinite;
        }

        @keyframes particle-float {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 0.4;
            }
            90% {
                opacity: 0.4;
            }
            100% {
                transform: translateY(-100vh) translateX(100px);
                opacity: 0;
            }
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px 0;
        }

        h1 {
            font-size: 2.8rem;
            background: linear-gradient(90deg, #8e2de2, #4a00e0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 15px rgba(142, 45, 226, 0.3);
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #a0a0a0;
            font-size: 1.1rem;
        }

        /* Card container */
        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Card */
        .url-card {
            background: rgba(20, 20, 35, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5),
                        0 5px 15px rgba(0, 0, 0, 0.3),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 25px;
            transition: all 0.3s ease;
            animation: fadeIn 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .url-card:nth-child(1) { animation-delay: 0.1s; }
        .url-card:nth-child(2) { animation-delay: 0.2s; }
        .url-card:nth-child(3) { animation-delay: 0.3s; }
        .url-card:nth-child(4) { animation-delay: 0.4s; }
        .url-card:nth-child(5) { animation-delay: 0.5s; }
        .url-card:nth-child(6) { animation-delay: 0.6s; }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .url-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6),
                        0 10px 20px rgba(0, 0, 0, 0.4);
            border-color: rgba(142, 45, 226, 0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(100, 100, 150, 0.2);
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #c0c0c0;
        }

        .card-date {
            font-size: 0.9rem;
            color: #707090;
        }

        /* Link sections */
        .link-section {
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(30, 30, 45, 0.5);
            border-radius: 15px;
            border: 1px solid rgba(100, 100, 150, 0.2);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .link-section:last-child {
            margin-bottom: 0;
        }

        .link-section::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(142, 45, 226, 0.1), rgba(74, 0, 224, 0.1));
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: -1;
        }

        .link-section:hover::before {
            opacity: 1;
        }

        .link-section:hover {
            border-color: rgba(142, 45, 226, 0.4);
        }

        .section-title {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            font-size: 1rem;
            color: #a0a0a0;
        }

        .section-icon {
            width: 20px;
            height: 20px;
            margin-right: 8px;
            background: linear-gradient(90deg, #8e2de2, #4a00e0);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .section-icon svg {
            width: 12px;
            height: 12px;
            fill: white;
        }

        .link-display {
            display: flex;
            align-items: center;
            background: rgba(20, 20, 35, 0.7);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid rgba(100, 100, 150, 0.2);
        }

        .link-text {
            flex: 1;
            font-size: 0.95rem;
            color: #e0e0e0;
            word-break: break-all;
            padding-right: 10px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .copy-btn {
            width: 36px;
            height: 36px;
            background: rgba(142, 45, 226, 0.2);
            border: 1px solid rgba(142, 45, 226, 0.4);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .copy-btn:hover {
            background: rgba(142, 45, 226, 0.3);
            border-color: rgba(142, 45, 226, 0.6);
            transform: scale(1.05);
        }

        .copy-btn svg {
            width: 16px;
            height: 16px;
            fill: #c0c0c0;
        }

        .link-stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #9090a0;
        }

        .stat-item {
            display: flex;
            align-items: center;
        }

        .stat-icon {
            width: 14px;
            height: 14px;
            margin-right: 5px;
            fill: #8e2de2;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(30, 30, 45, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 15px 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(142, 45, 226, 0.4);
            color: #e0e0e0;
            font-size: 0.95rem;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Add new button */
        .add-new-container {
            text-align: center;
            margin: 40px 0;
        }

        .add-new-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 15px 30px;
            background: linear-gradient(90deg, #8e2de2, #4a00e0);
            border: none;
            border-radius: 50px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(142, 45, 226, 0.4);
            position: relative;
            overflow: hidden;
            letter-spacing: 1px;
        }

        .add-new-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(142, 45, 226, 0.6);
        }

        .add-new-btn svg {
            width: 20px;
            height: 20px;
            margin-right: 8px;
            fill: white;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .cards-container {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 2.3rem;
            }
        }
    </style>
</head>
<body>
    <!-- Animated background elements -->
    <div class="bg-element"></div>
    <div class="bg-element"></div>
    <div class="bg-element"></div>
    
    <!-- Floating particles -->
    <div class="particles" id="particles"></div>
    
    <!-- Header -->
    <header>
        <h1>My Links</h1>
        <p class="subtitle">All your shortened URLs in one place</p>
    </header>
    
    <!-- Cards container -->
    <div class="cards-container" id="cardsContainer">
        <!-- Card s -->
        
        {% for items in date %}
            
      
        <!-- Card 4 -->
        <div class="url-card">
            <div class="card-header">
                <div class="card-title">{{items[0]}}</div>
               
            </div>
             
            <!-- Short Link Section -->
            <div class="link-section">
                <div class="section-title">
                    <div class="section-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M14.8,8L16,9.2l-4,4l-4-4L9.2,8L12,10.8L14.8,8z"/>
                        </svg>
                    </div>
                    Short Link
                </div>
                <div class="link-display">
                    <div class="link-text"> <a href="{{items[1]}}" style="color: #c0c0c0;">{{items[2]}}</a></div>
                    <div class="copy-btn" onclick="copyToClipboard(this)">
                        <svg viewBox="0 0 24 24">
                            <path d="M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z"/>
                        </svg>
                    </div>
                </div>
            </div>
            
            <!-- Original Link Section -->
            <div class="link-section">
                <div class="section-title">
                    <div class="section-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M10.59,13.41C11,13.8 11,14.44 10.59,14.83C10.2,15.22 9.56,15.22 9.17,14.83C7.22,12.88 7.22,9.71 9.17,7.76V7.76L12.71,4.22C14.66,2.27 17.83,2.27 19.78,4.22C21.73,6.17 21.73,9.34 19.78,11.29L18.29,12.78C18.3,11.96 18.17,11.14 17.89,10.36L18.36,9.88C19.54,8.71 19.54,6.81 18.36,5.64C17.19,4.46 15.29,4.46 14.12,5.64L10.59,9.17C9.41,10.34 9.41,12.24 10.59,13.41M13.41,9.17C13.8,8.78 14.44,8.78 14.83,9.17C16.78,11.12 16.78,14.29 14.83,16.24V16.24L11.29,19.78C9.34,21.73 6.17,21.73 4.22,19.78C2.27,17.83 2.27,14.66 4.22,12.71L5.71,11.22C5.7,12.04 5.83,12.86 6.11,13.65L5.64,14.12C4.46,15.29 4.46,17.19 5.64,18.36C6.81,19.54 8.71,19.54 9.88,18.36L13.41,14.83C14.59,13.66 14.59,11.76 13.41,10.59C13,10.2 13,9.56 13.41,9.17Z"/>
                        </svg>
                    </div>
                    Original Link
                </div>
                
                <div class="link-display">
                    <div class="link-text">{{items[1]}}</div>
                    <div class="copy-btn" onclick="copyToClipboard(this)">
                        <svg viewBox="0 0 24 24">
                            <path d="M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z"/>
                        </svg>
                    </div>
                </div>
            </div>
        </div>
          {% endfor %}
    </div>
    
    <!-- Add new button -->
    <div class="add-new-container">
        <button class="add-new-btn" onclick="window.location.href='/'">
            <svg viewBox="0 0 24 24">
                <path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z"/>
            </svg>
            Create New Link
        </button>
    </div>
    
    <!-- Toast notification -->
    <div class="toast" id="toast">Link copied to clipboard!</div>

    <script>
        // Create floating particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 30;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Random size between 2px and 6px
                const size = Math.random() * 4 + 2;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                
                // Random starting position
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = `${Math.random() * 100}%`;
                
                // Random animation duration
                const duration = Math.random() * 10 + 15;
                particle.style.animationDuration = `${duration}s`;
                
                // Random delay
                particle.style.animationDelay = `${Math.random() * 5}s`;
                
                particlesContainer.appendChild(particle);
            }
        }
        
        // Initialize particles on page load
        window.addEventListener('load', createParticles);
        
        // Copy to clipboard function
        function copyToClipboard(button) {
            const linkText = button.parentElement.querySelector('.link-text').innerText;
            
            // Create a temporary textarea element
            const textarea = document.createElement('textarea');
            textarea.value = linkText;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            
            // Select and copy the text
            textarea.select();
            document.execCommand('copy');
            
            // Remove the temporary element
            document.body.removeChild(textarea);
            
            // Show toast notification
            showToast();
        }
        
        // Show toast notification
        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            
            // Hide the toast after 3 seconds
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
